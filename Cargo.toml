[package]
name = "isos"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local manager for Island EOS and EGIA deployments"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
