name: IsOS CLI release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare an archive or publish a previously prepared archive
        required: true
        type: choice
        options:
          - prepare
          - publish
      prepare_run_id:
        description: Successful prepare run ID (required for publish)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build and package CLI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Prepare from master only' >&2; exit 1; }
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          name="isos-v${version}-linux-x86_64"
          mkdir -p release/package
          cp target/release/isos LICENSE README.md release/package/
          tar -C release/package -czf "release/${name}.tar.gz" .
          (cd release && sha256sum "${name}.tar.gz" > SHA256SUMS)
          printf '%s\n' "$version" > release/VERSION
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE_COMMIT
          echo "name=${name}" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.phase == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish prepared archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Publish from master only' >&2; exit 1; }
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'prepare_run_id must be numeric' >&2; exit 1; }
          gh run view "$PREPARE_RUN_ID" --json conclusion,workflowName --jq 'select(.conclusion == "success" and .workflowName == "IsOS CLI release") | .conclusion' | grep -qx success
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          name="isos-v${version}-linux-x86_64"
          gh run download "$PREPARE_RUN_ID" --name "$name" --dir release
          [[ "$(cat release/VERSION)" == "$version" ]] || { echo 'Prepared version differs from Cargo.toml' >&2; exit 1; }
          commit="$(cat release/SOURCE_COMMIT)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid prepared commit' >&2; exit 1; }
          git merge-base --is-ancestor "$commit" origin/master
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "v${version}" "release/${name}.tar.gz" release/SHA256SUMS \
            --target "$commit" --title "IsOS v${version}" \
            --notes "Linux x86_64 IsOS CLI and local API server. IsosUI is released separately. Prepared from ${commit}."
