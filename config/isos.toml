# Portable IsOS defaults. Relative source paths are resolved from the IsOS checkout.
# Use ISOS_CONFIG=/absolute/path/to/file.toml to load another file.
# Environment variables override matching values.
[server]
http_port = 16000
ui_port = 16001

[paths]
# Prebuilt artifacts from each owning repository; build there before running IsOS.
aether_bin_dir = "../Island-eos/target/debug"
egia_bin_dir = "../Island-egia/bin"
egia_defaults_dir = "../Island-egia/etc/egia"
egia_factory_defaults_dir = "../Island-egia/share/defaults/egia"
ui_dist = "../IsosUI/dist/local"

[deployment]
name = "default"

[logging]
default_source = "all"
level = "info"
max_bytes = 262144
backups = 2
max_sources = 32
